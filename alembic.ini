# Alembic Configuration for OpenCredit
# =====================================================

[alembic]
# Path to migration scripts
script_location = alembic

# Version path separator - use OS-appropriate separator
version_path_separator = os

# SQLAlchemy URL - will be overridden by env.py
sqlalchemy.url = sqlite:///./opencredit.db

[post_write_hooks]
# Format migrations with black (optional)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
