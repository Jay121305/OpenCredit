[project]
name = "opencredit"
version = "1.0.0"
description = "Production-style simulation of a digital credit and payment infrastructure platform"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "SQLAlchemy==2.0.43",
    "psycopg[binary]==3.2.10",
    "redis==6.4.0",
    "pydantic-settings==2.10.1",
    "python-jose[cryptography]==3.5.0",
    "scikit-learn==1.7.1; python_version < '3.14'",
    "numpy==2.2.6; python_version < '3.14'",
    "pandas==2.3.2; python_version < '3.14'",
    "python-dotenv==1.1.1",
    "email-validator==2.3.0",
    "slowapi==0.1.9",
    "alembic==1.15.2",
    "prometheus-fastapi-instrumentator==7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
    "pytest-cov>=4.1",
    "psutil>=5.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/*"]
