# =============================================================================
# Render Blueprint - OpenCredit Deployment Configuration
# =============================================================================
# This file defines all services for one-click deployment on Render.com
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Main API Service
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: opencredit-api
    runtime: docker
    plan: free  # Free tier: 750 hours/month, sleeps after 15min inactivity
    dockerfilePath: ./Dockerfile
    dockerContext: .
    
    # Health check endpoint
    healthCheckPath: /health
    
    # Environment variables (secrets go in Render dashboard)
    envVars:
      - key: ENV
        value: production
      
      - key: APP_NAME
        value: OpenCredit
      
      - key: API_PREFIX
        value: /api/v1
      
      # Database URL (automatically set by Render when you add PostgreSQL)
      - key: DATABASE_URL
        fromDatabase:
          name: opencredit-db
          property: connectionString
      
      # JWT Secret (set in Render dashboard as secret)
      - key: JWT_SECRET
        generateValue: true  # Render will auto-generate
      
      - key: JWT_ALGORITHM
        value: HS256
      
      - key: JWT_EXPIRE_MINUTES
        value: 60
      
      # Redis URL (set after creating Redis instance)
      - key: REDIS_URL
        sync: false  # Manually set in dashboard
      
      # Fraud detection settings
      - key: DEFAULT_CREDIT_LIMIT
        value: 5000.0
      
      - key: MAX_TRANSACTION_AMOUNT
        value: 10000.0
      
      - key: HIGH_VALUE_THRESHOLD
        value: 5000
      
      - key: VELOCITY_WINDOW_SECONDS
        value: 60
      
      - key: VELOCITY_MAX_TXN_COUNT
        value: 5
      
      - key: FRAUD_WEIGHT_HIGH_VALUE
        value: 0.45
      
      - key: FRAUD_WEIGHT_VELOCITY
        value: 0.25
      
      - key: FRAUD_WEIGHT_GEO_MISMATCH
        value: 0.10
      
      - key: FRAUD_WEIGHT_ML_MAX
        value: 0.30
      
      - key: FRAUD_THRESHOLD_REJECT
        value: 0.75
      
      - key: FRAUD_THRESHOLD_FLAG
        value: 0.50
      
      # Rate limiting
      - key: RATE_LIMIT_AUTH
        value: 5/minute
      
      - key: RATE_LIMIT_PAYMENTS
        value: 100/minute
      
      - key: RATE_LIMIT_DEFAULT
        value: 60/minute
      
      # CORS (update with your Render URL after deployment)
      - key: CORS_ORIGINS
        value: https://opencredit-api.onrender.com

  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL Database (Free Tier)
  # ─────────────────────────────────────────────────────────────────────────────
  # NOTE: Render's free PostgreSQL expires after 90 days
  # For permanent free DB, use https://neon.tech or keep SQLite

databases:
  - name: opencredit-db
    plan: free  # Free tier: 90 days, then expires (1GB storage)
    databaseName: opencredit
    user: opencredit
