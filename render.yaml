# =============================================================================
# Render Blueprint - OpenCredit Deployment Configuration
# =============================================================================
# This file defines all services for one-click deployment on Render.com
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Main API Service
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: opencredit-api
    runtime: docker
    plan: free  # Free tier: 750 hours/month, sleeps after 15min inactivity
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    
    # Health check endpoint
    healthCheckPath: /health
    
    # Environment variables (secrets go in Render dashboard)
    envVars:
      - key: ENV
        value: production
      
      - key: APP_NAME
        value: OpenCredit
      
      - key: API_PREFIX
        value: /api/v1
      
      # Database URL - Set this in Render Dashboard with your Neon.tech connection string
      # Format: postgresql://user:password@ep-xxx-xxx.neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false  # MUST be set manually in Render dashboard
      
      # JWT Secret (set in Render dashboard as secret)
      - key: JWT_SECRET
        generateValue: true  # Render will auto-generate
      
      - key: JWT_ALGORITHM
        value: HS256
      
      - key: JWT_EXPIRE_MINUTES
        value: 60
      
      # Redis URL (OPTIONAL - app works without it)
      - key: REDIS_URL
        value: redis://localhost:6379/0
      
      # Fraud detection settings
      - key: DEFAULT_CREDIT_LIMIT
        value: 5000.0
      
      - key: MAX_TRANSACTION_AMOUNT
        value: 10000.0
      
      - key: HIGH_VALUE_THRESHOLD
        value: 5000
      
      - key: VELOCITY_WINDOW_SECONDS
        value: 60
      
      - key: VELOCITY_MAX_TXN_COUNT
        value: 5
      
      - key: FRAUD_WEIGHT_HIGH_VALUE
        value: 0.45
      
      - key: FRAUD_WEIGHT_VELOCITY
        value: 0.25
      
      - key: FRAUD_WEIGHT_GEO_MISMATCH
        value: 0.10
      
      - key: FRAUD_WEIGHT_ML_MAX
        value: 0.30
      
      - key: FRAUD_THRESHOLD_REJECT
        value: 0.75
      
      - key: FRAUD_THRESHOLD_FLAG
        value: 0.50
      
      # Rate limiting
      - key: RATE_LIMIT_AUTH
        value: 5/minute
      
      - key: RATE_LIMIT_PAYMENTS
        value: 100/minute
      
      - key: RATE_LIMIT_DEFAULT
        value: 60/minute
      
      # CORS (update with your Render URL after deployment)
      - key: CORS_ORIGINS
        value: https://opencredit-api.onrender.com

# ─────────────────────────────────────────────────────────────────────────────
# NOTE: No database block needed when using external providers like Neon.tech
# Set DATABASE_URL manually in Render dashboard Environment tab
# ─────────────────────────────────────────────────────────────────────────────

